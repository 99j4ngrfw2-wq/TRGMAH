<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مترجم وصرف العملات</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: #f4f6fa; color: #222;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 40px;
  }
  h1 { font-size: 20px; margin: 0 0 20px; color: #333; }
  .flags { display: flex; gap: 24px; justify-content: center; margin-bottom: 12px; }
  .flag-btn {
    width: clamp(70px, 19vw, 92px); height: clamp(70px, 19vw, 92px);
    border-radius: 50%; border: none;
    font-size: clamp(30px, 9vw, 42px); background: #fff; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.15);
    transition: transform .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .id-btn { font-size: clamp(18px, 5.2vw, 24px); letter-spacing: -1px; white-space: nowrap; }
  .text-btn { font-size: clamp(22px, 6.5vw, 30px); font-weight: 700; color: #1f3b73; font-family: inherit; }
  .flag-btn:active { transform: scale(.94); }
  .flag-btn.listening { animation: pulse 1s infinite; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(229,57,53,.45); }
    70%  { box-shadow: 0 0 0 16px rgba(229,57,53,0); }
    100% { box-shadow: 0 0 0 0 rgba(229,57,53,0); }
  }
  .hint { font-size: 14px; color: #777; margin-bottom: 20px; text-align: center; }
  .status { min-height: 22px; color: #e53935; font-size: 14px; margin-bottom: 12px; text-align: center; }
  .card {
    width: 100%; max-width: 480px; background: #fff; border-radius: 16px;
    padding: 10px 12px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .card-head { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #888; }
  .btns { display: flex; gap: 6px; }
  .speak {
    border: none; background: #eef3ff; border-radius: 10px;
    padding: 6px 12px; font-size: 15px; cursor: pointer; font-family: inherit;
  }
  .speak:disabled { opacity: .4; cursor: default; }
  .copy-btn { font-weight: 700; background: #555b63; color: #fff; font-size: 12px; padding: 5px 9px; }
  .text { font-size: 16px; line-height: 1.6; margin-top: 6px; min-height: 24px; max-height: 96px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ltr { direction: ltr; text-align: left; }

  /* ===== قسم التحويل ===== */
  .fx {
    width: 100%; max-width: 480px; border-radius: 22px; padding: 18px;
    background: #0b0f1a; color: #e5e7eb; border: 1px solid #1f2937;
    box-shadow: 0 4px 18px rgba(0,0,0,.25);
  }
  .fx-top { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #9ca3af; margin-bottom: 10px; }
  .fx-top #fx-cur { font-size: 15px; color: #d1d5db; direction: ltr; }
  .fx-input {
    width: 100%; height: 84px; border-radius: 16px; border: 1px solid #1f2937;
    background: #050813; color: #e5e7eb; text-align: center;
    font-family: inherit; font-size: 34px; font-weight: 700; padding: 0 12px;
    outline: none; direction: ltr; -moz-appearance: textfield;
  }
  .fx-input::-webkit-outer-spin-button, .fx-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .fx-input::placeholder { color: #374151; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 12px 0 16px; padding-bottom: 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid #1f2937; background: #111827; color: #e5e7eb;
    border-radius: 12px; padding: 10px 14px; font-family: inherit; font-size: 15px; font-weight: 700;
    cursor: pointer; direction: ltr;
  }
  .chip:active { background: #1f2937; }
  .dirs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dir {
    border: 1px solid #1f2937; background: #111827; color: #e5e7eb; border-radius: 18px;
    padding: 8px 6px; cursor: pointer; font-family: inherit; text-align: center;
  }
  .dir.active { border-color: #4b5563; background: #151d2e; }
  .dir .pair { font-size: 18px; direction: ltr; }
  .dir .arr-red { color: #f87171; }
  .dir .arr-green { color: #4ade80; }
  .dir .name { font-size: 14px; font-weight: 700; margin-top: 4px; }
  .dir .code { font-size: 11px; color: #9ca3af; margin-top: 2px; direction: ltr; }
  .fx-result { margin-top: 16px; text-align: center; font-size: clamp(18px, 5vw, 24px); font-weight: 700; color: #e5e7eb; direction: ltr; overflow-wrap: anywhere; min-height: 30px; }
  .fx-rate { text-align: center; font-size: 13px; color: #9ca3af; margin-top: 6px; direction: ltr; }
  .fx-updated { text-align: center; font-size: 12px; color: #6b7280; margin-top: 4px; }

  .phr-open {
    position: fixed; top: 12px; left: 12px; z-index: 5;
    border: none; border-radius: 20px; padding: 8px 12px;
    background: #1f3b73; color: #fff; font-family: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  .phr-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10;
    display: none; align-items: flex-end; justify-content: center;
  }
  .phr-overlay.open { display: flex; }
  .phr-box {
    background: #fff; width: 100%; max-width: 480px; max-height: 80vh; overflow-y: auto;
    border-radius: 20px 20px 0 0; padding: 16px;
  }
  .phr-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 17px; }
  .phr-item {
    display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: center;
    padding: 10px 2px; border-bottom: 1px solid #eee; cursor: pointer;
  }
  .phr-item:active { background: #f3f6fb; }
  .phr-ar { font-size: 16px; font-weight: 700; }
  .phr-id { font-size: 14px; color: #555; direction: ltr; text-align: left; }
  .phr-speak { font-size: 16px; }

  @media (max-width: 380px) {
    body { padding: 16px 12px 32px; }
    h1 { font-size: 18px; margin-bottom: 14px; }
    .flags { gap: 14px; }
    .text { font-size: 15px; }
    .card { padding: 8px 10px; }
    .fx { padding: 14px; }
    .fx-input { height: 72px; font-size: 28px; }
    .speak { padding: 6px 9px; }
  }
  @media (min-width: 600px) {
    body { padding-top: 40px; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<button id="phr-btn" class="phr-open">كلمات ترحيبية</button>

<h1>مترجم صوتي</h1>

<div class="flags">
  <button id="btn-ar" class="flag-btn text-btn" title="تكلم بالعربي">عربي 🎤</button>
  <button id="btn-id" class="flag-btn id-btn" title="Bicara bahasa Indonesia">🇮🇩🎤</button>
</div>
<div class="hint">اضغط عشان تتكلم، واضغطه مرة ثانية عشان توقف</div>

<div id="status" class="status"></div>

<div class="card">
  <div class="card-head">
    <span id="src-label">الكلام</span>
    <div class="btns">
      <button id="src-copy" class="speak copy-btn" disabled>نسخ</button>
      <button id="src-speak" class="speak" disabled>📣</button>
    </div>
  </div>
  <div id="src-text" class="text"></div>
</div>

<div class="card">
  <div class="card-head">
    <span id="tgt-label">الترجمة</span>
    <div class="btns">
      <button id="tgt-copy" class="speak copy-btn" disabled>نسخ</button>
      <button id="tgt-speak" class="speak" disabled>📣</button>
    </div>
  </div>
  <div id="tgt-text" class="text"></div>
</div>

<div class="fx">
  <div class="fx-top">
    <span>أدخل المبلغ المراد تحويله</span>
    <span id="fx-cur">0</span>
  </div>

  <input id="fx-amount" class="fx-input" type="text" inputmode="decimal" placeholder="0">

  <div class="chips">
    <button class="chip" data-v="10">10</button>
    <button class="chip" data-v="50">50</button>
    <button class="chip" data-v="100">100</button>
    <button class="chip" data-v="500">500</button>
    <button class="chip" data-v="1000">1,000</button>
    <button class="chip" data-v="10000">10,000</button>
    <button class="chip" data-v="50000">50,000</button>
    <button class="chip" data-v="100000">100,000</button>
    <button class="chip" data-v="1000000">1,000,000</button>
  </div>

  <div class="dirs">
    <button id="dir-idr" class="dir active">
      <div class="pair">🇮🇩 <span class="arr-red">➔</span> 🇸🇦</div>
      <div class="name">روبية إلى ريال</div>
      <div class="code">IDR ➔ SAR</div>
    </button>
    <button id="dir-sar" class="dir">
      <div class="pair">🇸🇦 <span class="arr-green">➔</span> 🇮🇩</div>
      <div class="name">ريال إلى روبية</div>
      <div class="code">SAR ➔ IDR</div>
    </button>
  </div>

  <div id="fx-result" class="fx-result">—</div>
  <div id="fx-rate" class="fx-rate"></div>
  <div id="fx-updated" class="fx-updated">جاري جلب السعر...</div>
</div>

<div id="phr-overlay" class="phr-overlay">
  <div class="phr-box">
    <div class="phr-head">
      <strong>كلمات ترحيبية</strong>
      <button id="phr-close" class="speak">✕</button>
    </div>
    <div id="phr-list"></div>
  </div>
</div>

<script>
  const LANGS = {
    ar: { name: "العربية", speech: "ar-SA", label: "Arabic", code: "ar" },
    id: { name: "Indonesia", speech: "id-ID", label: "Indonesian", code: "id" }
  };

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const $ = id => document.getElementById(id);

  let rec = null;
  let listening = false;
  let liveTimer = null;
  let reqCounter = 0;

  function setStatus(t) { $('status').textContent = t; }

  function startListening(src) {
    if (!SR) {
      setStatus('المتصفح ما يدعم التعرف على الصوت، استخدم Chrome أو Edge');
      return;
    }
    const tgt = src === 'ar' ? 'id' : 'ar';

    rec = new SR();
    rec.lang = LANGS[src].speech;
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;

    let finalText = '';

    rec.onstart = () => {
      listening = true;
      $('btn-' + src).classList.add('listening');
      setStatus('تكلم الآن... (' + LANGS[src].name + ')');
      $('src-label').textContent = LANGS[src].name;
      $('tgt-label').textContent = LANGS[tgt].name;
      $('src-text').textContent = '';
      $('tgt-text').textContent = '';
      $('src-speak').disabled = true;
      $('tgt-speak').disabled = true;
      $('src-copy').disabled = true;
      $('tgt-copy').disabled = true;
      $('src-speak').dataset.lang = src;
      $('tgt-speak').dataset.lang = tgt;
    };

    rec.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t + ' ';
        else interim += t;
      }
      const cur = (finalText + interim).trim();
      $('src-text').textContent = cur;
      clearTimeout(liveTimer);
      if (cur) {
        liveTimer = setTimeout(() => translate(cur, src, tgt, false), 400);
      }
    };

    rec.onerror = e => {
      if (e.error === 'no-speech') setStatus('ما سمعت شي، جرب مرة ثانية');
      else if (e.error === 'not-allowed') setStatus('اسمح للموقع باستخدام الميكروفون');
      else setStatus('خطأ في الصوت: ' + e.error);
    };

    rec.onend = () => {
      listening = false;
      $('btn-' + src).classList.remove('listening');
      const text = $('src-text').textContent.trim();
      if (text) {
        $('src-speak').disabled = false;
        $('src-copy').disabled = false;
        clearTimeout(liveTimer);
        translate(text, src, tgt, true);
      } else if (!/^(ما سمعت|اسمح|خطأ)/.test($('status').textContent)) {
        setStatus('ما سمعت شي، جرب مرة ثانية');
      }
    };

    rec.start();
  }

  function unlockSpeech() {
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
  }

  function toggle(src) {
    unlockSpeech();
    if (listening) rec.stop();
    else startListening(src);
  }

  async function translate(text, src, tgt, isFinal) {
    const myReq = ++reqCounter;
    if (isFinal) setStatus('جاري الترجمة...');
    try {
      const url = 'https://translate.googleapis.com/translate_a/single?client=gtx' +
                  '&sl=' + LANGS[src].code + '&tl=' + LANGS[tgt].code +
                  '&dt=t&q=' + encodeURIComponent(text);
      const res = await fetch(url);
      const data = await res.json();
      const out = data[0].map(part => part[0]).join('');
      if (myReq !== reqCounter) return;

      $('tgt-text').textContent = out;
      $('tgt-label').textContent = LANGS[tgt].name;
      $('tgt-speak').disabled = false;
      $('tgt-copy').disabled = false;
      $('tgt-speak').dataset.lang = tgt;
      $('src-speak').dataset.lang = src;
      $('src-text').classList.toggle('ltr', src === 'id');
      $('tgt-text').classList.toggle('ltr', tgt === 'id');
      if (isFinal) { setStatus(''); speak(out, tgt); }
    } catch (err) {
      setStatus('فشلت الترجمة، تأكد من الإنترنت');
    }
  }

  function speak(text, lang) {
    if (!text || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LANGS[lang].speech;
    speechSynthesis.speak(u);
  }

  function copyText(text, btn) {
    if (!text) return;
    const done = () => {
      btn.textContent = 'تم ✅';
      setTimeout(() => { btn.textContent = 'نسخ'; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { setStatus('ما قدرت أنسخ النص'); }
    document.body.removeChild(ta);
  }

  $('btn-ar').addEventListener('click', () => toggle('ar'));
  $('btn-id').addEventListener('click', () => toggle('id'));
  $('src-speak').addEventListener('click', () => speak($('src-text').textContent, $('src-speak').dataset.lang || 'ar'));
  $('tgt-speak').addEventListener('click', () => speak($('tgt-text').textContent, $('tgt-speak').dataset.lang || 'id'));
  $('src-copy').addEventListener('click', () => copyText($('src-text').textContent.trim(), $('src-copy')));
  $('tgt-copy').addEventListener('click', () => copyText($('tgt-text').textContent.trim(), $('tgt-copy')));

  /* ===== تحويل العملات ===== */
  let idrPerSar = null;
  let fxDir = 'IDR'; // IDR = روبية إلى ريال، SAR = ريال إلى روبية

  const FALLBACK_IDR_PER_SAR = 4200; // سعر تقريبي يُستخدم فقط إذا فشل جلب السعر الحقيقي

  const RATE_SOURCES = [
    {
      url: 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/sar.json',
      read: d => d.sar.idr
    },
    {
      url: 'https://latest.currency-api.pages.dev/v1/currencies/sar.json',
      read: d => d.sar.idr
    },
    {
      url: 'https://open.er-api.com/v6/latest/SAR',
      read: d => d.rates.IDR
    }
  ];

  async function loadRates() {
    let got = null;
    for (const src of RATE_SOURCES) {
      try {
        const r = await fetch(src.url, { cache: 'no-store' });
        if (!r.ok) continue;
        const v = Number(src.read(await r.json()));
        if (v > 0) { got = v; break; }
      } catch (e) { /* جرّب المصدر اللي بعده */ }
    }
    if (got) {
      idrPerSar = got;
      const t = new Date().toLocaleString('ar', { dateStyle: 'medium', timeStyle: 'short' });
      $('fx-updated').textContent = 'آخر تحديث للسعر: ' + t;
    } else {
      idrPerSar = FALLBACK_IDR_PER_SAR;
      $('fx-updated').textContent = 'تعذر جلب السعر الحالي، الحاسبة تستخدم سعر تقريبي';
    }
    convert();
  }

  function fmt(n, cur) {
    if (cur === 'IDR') return Math.round(n).toLocaleString('en-US');
    return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function setDir(d) {
    fxDir = d;
    $('dir-idr').classList.toggle('active', d === 'IDR');
    $('dir-sar').classList.toggle('active', d === 'SAR');
    convert();
  }

  function parseAmount(s) {
    s = (s || '')
      .replace(/[\u0660-\u0669]/g, d => d.charCodeAt(0) - 0x0660)
      .replace(/[\u06F0-\u06F9]/g, d => d.charCodeAt(0) - 0x06F0)
      .replace(/\u066B/g, '.')
      .replace(/[,\u066C\s]/g, '');
    return parseFloat(s);
  }

  function convert() {
    const amt = parseAmount($('fx-amount').value);
    const from = fxDir;
    const to = from === 'IDR' ? 'SAR' : 'IDR';
    $('fx-cur').textContent = isNaN(amt) ? '0' : fmt(amt, from);
    if (!idrPerSar || isNaN(amt)) {
      $('fx-result').textContent = '—';
      $('fx-rate').textContent = '';
      return;
    }
    const sar = from === 'SAR' ? amt : amt / idrPerSar;
    const res = to === 'SAR' ? sar : sar * idrPerSar;
    $('fx-result').textContent = fmt(amt, from) + ' ' + from + ' = ' + fmt(res, to) + ' ' + to;
    const oneFrom = from === 'SAR' ? idrPerSar : 1 / idrPerSar;
    $('fx-rate').textContent = '1 ' + from + ' ≈ ' + fmt(oneFrom, to) + ' ' + to;
  }

  $('fx-amount').addEventListener('input', convert);
  $('dir-idr').addEventListener('click', () => setDir('IDR'));
  $('dir-sar').addEventListener('click', () => setDir('SAR'));
  document.querySelectorAll('.chip').forEach(b => {
    b.addEventListener('click', () => {
      $('fx-amount').value = b.dataset.v;
      convert();
    });
  });

  /* ===== كلمات ترحيبية للسياح ===== */
  const PHRASES = [
    ["مرحباً بك", "Selamat datang"],
    ["كيف حالك؟", "Apa kabar?"],
    ["أنا بخير، شكراً", "Saya baik, terima kasih"],
    ["ما اسمك؟", "Siapa nama Anda?"],
    ["اسمي ...", "Nama saya ..."],
    ["من وين أنت؟", "Anda dari mana?"],
    ["أنا من السعودية", "Saya dari Arab Saudi"],
    ["بكم هذا؟", "Berapa harganya?"],
    ["غالي", "Mahal"],
    ["رخيص", "Murah"],
    ["ممكن تخفض السعر؟", "Bisa kurangi harganya?"],
    ["أبغى هذا", "Saya mau yang ini"],
    ["وين الحمام؟", "Di mana toiletnya?"],
    ["وين أقرب مطار؟", "Di mana bandara terdekat?"],
    ["أنا جوعان", "Saya lapar"],
    ["هذا لذيذ", "Ini enak"],
    ["ما أفهم", "Saya tidak mengerti"],
    ["تكلم ببطء من فضلك", "Tolong bicara pelan-pelan"],
    ["ساعدني من فضلك", "Tolong bantu saya"],
    ["ممكن صورة؟", "Boleh foto?"],
    ["الحساب من فضلك", "Minta bonnya"],
    ["شكراً جزيلاً", "Terima kasih banyak"],
    ["عفواً", "Sama-sama"],
    ["مع السلامة", "Sampai jumpa"]
  ];

  function renderPhrases() {
    const box = $('phr-list');
    box.innerHTML = '';
    PHRASES.forEach(([ar, id]) => {
      const row = document.createElement('div');
      row.className = 'phr-item';
      const a = document.createElement('div');
      a.className = 'phr-ar';
      a.textContent = ar;
      const i = document.createElement('div');
      i.className = 'phr-id';
      i.textContent = id;
      const s = document.createElement('span');
      s.className = 'phr-speak';
      s.textContent = '📣';
      row.append(a, i, s);
      row.addEventListener('click', () => speak(id, 'id'));
      box.appendChild(row);
    });
  }

  $('phr-btn').addEventListener('click', () => $('phr-overlay').classList.add('open'));
  $('phr-close').addEventListener('click', () => $('phr-overlay').classList.remove('open'));
  $('phr-overlay').addEventListener('click', e => {
    if (e.target === $('phr-overlay')) $('phr-overlay').classList.remove('open');
  });
  renderPhrases();

  loadRates();
</script>
</body>
</html>
